name: Bygg URKH-apper

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Skriv RELEASE for å opprette en ny utgivelse
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ inputs.confirm_release == 'RELEASE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Stopp hvis versjonen allerede er publisert
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Versjonen finnes allerede. Historiske releases overskrives aldri."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - run: gradle -p android assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk URKH-Android.apk
      - run: zip -r URKH-iPhone-kildekode.zip ios
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            URKH-Android.apk
            URKH-iPhone-kildekode.zip
          name: URKH v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
