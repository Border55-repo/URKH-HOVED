name: Bygg URKH-apper
on:
  workflow_dispatch:
  push:
    branches: ['main']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p android assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk URKH-Android.apk
      - run: zip -r URKH-iPhone-kildekode.zip ios
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            URKH-Android.apk
            URKH-iPhone-kildekode.zip
          name: URKH ${{ steps.version.outputs.version }}
          body: Ny URKH-versjon med møteinnkalling, møtereferat, Korpsbrev, Android-app og iPhone-støtte. Laget av Julian Nordli.
