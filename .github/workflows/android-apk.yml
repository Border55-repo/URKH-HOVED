name: Bygg Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p android assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk RodeReferat-Android.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: RodeReferat-Android.apk
          name: RødeReferat ${{ github.ref_name }}
          body: Installer APK-filen på Android. Appen trenger mikrofontillatelse for møteopptak.
