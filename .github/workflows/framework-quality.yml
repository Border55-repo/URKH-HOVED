name: Framework-kontroll

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Kontroller versjon og release-notater
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s RELEASE_NOTES.md
      - name: Kontroller JavaScript
        run: |
          node --check app.js
          node --check service-worker.js
          node --check transcription-worker.js
      - name: Kontroller plattformfiler
        run: |
          test -f android/app/build.gradle
          test -f ios/project.yml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Test Android-bygg
        run: gradle -p android assembleDebug
